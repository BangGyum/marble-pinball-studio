<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>바울 핀볼 · 전체 맵 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0e;color:#e4f9f6;font:15px system-ui}main{display:flex;align-items:center;justify-content:center;gap:32px;min-height:100vh;padding:18px}canvas{width:min(60vw,620px);height:94vh}aside{width:280px}h1{font-size:32px;color:#93f6e9}p{line-height:1.7;color:#9cb5c8}label{display:block;margin-top:20px}button,select{padding:10px;background:#152536;color:#e4f9f6;border:1px solid #416273;border-radius:7px;margin:7px 5px 10px 0}output{display:block;white-space:pre-line;line-height:1.8;color:#a5ffed}@media(max-width:650px){main{flex-direction:column-reverse}canvas{width:100%;height:100vh}aside{width:100%}}
</style></head>
<body><main><canvas aria-label="실제 물리로 실행하는 전체 맵"></canvas><aside>
<h1>네온 핀볼 폭포</h1><p id="description"></p>
<label for="map">맵 선택</label><select id="map"><option value="0">1번 · 네온 핀볼 폭포</option><option value="1">3번 · 카오스 시계탑</option><option value="2">8번 · 오비탈 락</option><option value="3">4번 · 네온 모래시계</option><option value="4">10번 · 균열 협곡</option><option value="5">네온 크로스웨이</option></select>
<label for="count">구슬 수</label><select id="count"><option>1</option><option>9</option><option>20</option><option selected>28</option><option>100</option><option>200</option><option>300</option></select>
<div><button id="start">1배속 주행</button><button id="reset">다시 준비</button></div><output aria-live="polite">준비 중</output>
</aside></main><img id="canyon-rock-texture" src="../src/assets/canyon-basalt.png" alt="" hidden /><script type="module" src="./arcade-preview.ts"></script></body></html>
